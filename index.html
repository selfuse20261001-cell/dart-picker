async function throwDart(){if(busy||!pool.length)return;busy=true;$("throw").disabled=true;$("bull").disabled=true;B.freeze=false;B.recoil=1;drawBoard();

 if(!rm){await anim(380,t=>{const e=ease(t);B.spd=lerp(8,110,e);placeDart(S[0]+18*e*g.sc,S[1]+26*e*g.sc,-125-12*e,1.9,1)})}

 // 命中

 if(!rm){for(let k=0;k<22;k++){const a=Math.random()*Math.PI*2,v=.08+Math.random()*.22;parts.push({x:tx,y:ty,vx:Math.cos(a)*v,vy:Math.sin(a)*v-.12,s:1.5+Math.random()*2.5,life:450+Math.random()*350,c:["#F6D27A","#F2A497","#fff","#B9DAA5","#7B7472"][k%5]})}
  document.querySelector("main").animate([{transform:"translate(0,0)"},{transform:"translate(5px,-4px)"},{transform:"translate(-4px,3px)"},{transform:"translate(2px,-1px)"},{transform:"translate(0,0)"}],{duration:280,easing:"ease-out"});
  const base=B.lastAng+8;await anim(650,t=>{B.recoil=1-.035*Math.sin(Math.min(1,t*3)*Math.PI);applyBoard();placeDart(tx,ty,base+11*Math.exp(-6*t)*Math.sin(t*38),1,1)})}
